<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusHub | Academic Resources</title>
  <link rel="stylesheet" href="../../css/global.css">
  <script src="../../js/api.js"></script>
  <style>
    .resources-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .select-sm, .input-sm {
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      font-size: 13px;
    }
    .resource-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .resource-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .res-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }
    .res-title {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 6px;
    }
    .res-meta {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <div class="resources-container">
    <div class="header-bar">
      <div>
        <h1 style="color: #f8fafc; font-size: 24px;">📚 Academic Resources Repository</h1>
        <p style="color: #94a3b8; font-size: 14px;">Access notes, study materials, question banks, and previous question papers.</p>
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="upload-btn" class="btn" style="display: none; background: #3b82f6; color: white;" onclick="openUploadModal()">+ Upload Resource</button>
        <button onclick="goBack()" class="btn" style="background: rgba(148, 163, 184, 0.2); color: #cbd5e1;">Back to Dashboard</button>
      </div>
    </div>

    <div class="filter-bar">
      <input type="text" id="search-input" class="input-sm" placeholder="Search resources..." onkeyup="fetchResources()">
      <select id="category-filter" class="select-sm" onchange="fetchResources()">
        <option value="">All Categories</option>
        <option value="NOTES">Notes</option>
        <option value="STUDY_MATERIAL">Study Material</option>
        <option value="QUESTION_BANK">Question Bank</option>
        <option value="PREVIOUS_PAPER">Previous Paper</option>
      </select>
      <select id="semester-filter" class="select-sm" onchange="fetchResources()">
        <option value="">All Semesters</option>
        <option value="1">Sem 1</option>
        <option value="2">Sem 2</option>
        <option value="3">Sem 3</option>
        <option value="4">Sem 4</option>
        <option value="5">Sem 5</option>
        <option value="6">Sem 6</option>
        <option value="7">Sem 7</option>
        <option value="8">Sem 8</option>
      </select>
    </div>

    <div id="resource-grid" class="resource-grid">
      <div style="color:#64748b;">Loading resources...</div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="upload-modal" class="modal">
    <div class="modal-content">
      <h3 style="color: #f8fafc; margin-bottom: 16px;">Upload Academic Resource</h3>
      <form id="upload-form" onsubmit="handleUpload(event)">
        <div style="margin-bottom: 10px;">
          <label style="color:#94a3b8; font-size:12px;">Title *</label>
          <input type="text" id="up-title" class="input-sm" style="width:100%;" required>
        </div>
        <div style="margin-bottom: 10px;">
          <label style="color:#94a3b8; font-size:12px;">Category *</label>
          <select id="up-category" class="select-sm" style="width:100%;" required>
            <option value="NOTES">Notes</option>
            <option value="STUDY_MATERIAL">Study Material</option>
            <option value="QUESTION_BANK">Question Bank</option>
            <option value="PREVIOUS_PAPER">Previous Paper</option>
          </select>
        </div>
        <div style="margin-bottom: 10px;">
          <label style="color:#94a3b8; font-size:12px;">Subject *</label>
          <input type="text" id="up-subject" class="input-sm" style="width:100%;" required placeholder="e.g. DBMS">
        </div>
        <div style="margin-bottom: 10px; display:flex; gap:10px;">
          <div style="flex:1;">
            <label style="color:#94a3b8; font-size:12px;">Semester *</label>
            <input type="number" id="up-semester" class="input-sm" style="width:100%;" min="1" max="10" value="5" required>
          </div>
          <div style="flex:1;">
            <label style="color:#94a3b8; font-size:12px;">Academic Year *</label>
            <input type="text" id="up-year" class="input-sm" style="width:100%;" value="2026-27" required>
          </div>
        </div>
        <div style="margin-bottom: 10px;">
          <label style="color:#94a3b8; font-size:12px;">Unit</label>
          <input type="text" id="up-unit" class="input-sm" style="width:100%;" placeholder="e.g. Unit 1">
        </div>
        <div style="margin-bottom: 16px;">
          <label style="color:#94a3b8; font-size:12px;">File (PDF, DOCX, PPTX) *</label>
          <input type="file" id="up-file" style="color:#cbd5e1; font-size:13px;" required>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button type="button" class="btn" style="background:rgba(148,163,184,0.2); color:#cbd5e1;" onclick="closeUploadModal()">Cancel</button>
          <button type="submit" class="btn" style="background:#3b82f6; color:white;">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('campushub_token') || localStorage.getItem('token');
    const userObj = JSON.parse(localStorage.getItem('campushub_user') || '{}');
    const userRole = userObj.role || localStorage.getItem('role') || 'student';
    const userId = userObj._id || userObj.id || localStorage.getItem('userId');

    if (userRole === 'faculty' || userRole === 'admin') {
      document.getElementById('upload-btn').style.display = 'inline-block';
    }

    function goBack() {
      window.location.href = `../${userRole}/dashboard.html`;
    }

    function openUploadModal() {
      document.getElementById('upload-modal').style.display = 'flex';
    }

    function closeUploadModal() {
      document.getElementById('upload-modal').style.display = 'none';
    }

    async function fetchResources() {
      if (!token) {
        window.location.href = '../../login.html';
        return;
      }

      const search = document.getElementById('search-input').value;
      const category = document.getElementById('category-filter').value;
      const semester = document.getElementById('semester-filter').value;

      let url = 'http://localhost:5000/api/academic-resources?limit=50';
      if (search) url += `&search=${encodeURIComponent(search)}`;
      if (category) url += `&category=${category}`;
      if (semester) url += `&semester=${semester}`;

      try {
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();

        const grid = document.getElementById('resource-grid');
        if (!data.data || data.data.length === 0) {
          grid.innerHTML = '<div style="color:#64748b;">No academic resources found.</div>';
          return;
        }

        grid.innerHTML = data.data.map(r => {
          const isOwner = r.uploadedBy && (r.uploadedBy._id === userId || userRole === 'admin');
          return `
            <div class="resource-card">
              <div>
                <span class="res-badge">${r.category}</span>
                <div class="res-title">${escapeHtml(r.title)}</div>
                <div class="res-meta">
                  Subject: ${escapeHtml(r.subject)} • Sem ${r.semester}<br>
                  ${r.unit ? `Unit: ${escapeHtml(r.unit)} • ` : ''}Dept: ${escapeHtml(r.departmentId ? r.departmentId.code : 'All')}<br>
                  Uploaded by: ${escapeHtml(r.uploadedBy ? r.uploadedBy.name : 'Staff')}
                </div>
              </div>
              <div style="display:flex; gap:8px; margin-top:12px;">
                <button onclick="downloadFile('${r._id}')" class="btn btn-sm" style="background:rgba(16,185,129,0.2); color:#34d399; flex:1;">Download</button>
                ${isOwner ? `<button onclick="deleteRes('${r._id}')" class="btn btn-sm" style="background:rgba(239,68,68,0.2); color:#f87171;">Delete</button>` : ''}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    async function handleUpload(e) {
      e.preventDefault();
      const formData = new FormData();
      formData.append('title', document.getElementById('up-title').value);
      formData.append('category', document.getElementById('up-category').value);
      formData.append('subject', document.getElementById('up-subject').value);
      formData.append('semester', document.getElementById('up-semester').value);
      formData.append('academicYear', document.getElementById('up-year').value);
      formData.append('unit', document.getElementById('up-unit').value);
      formData.append('file', document.getElementById('up-file').files[0]);

      try {
        const res = await fetch('http://localhost:5000/api/academic-resources', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        const data = await res.json();
        if (res.status === 201) {
          closeUploadModal();
          fetchResources();
        } else {
          alert(data.message || 'Upload failed');
        }
      } catch (err) {
        console.error('Upload error:', err);
      }
    }

    async function downloadFile(id) {
      await downloadAuthenticatedFile(`/academic-resources/${id}/download`, 'academic_resource.pdf');
    }

    async function deleteRes(id) {
      if (!confirm('Are you sure you want to delete this resource?')) return;
      await fetch(`http://localhost:5000/api/academic-resources/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      fetchResources();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    fetchResources();
  </script>
</body>
</html>
