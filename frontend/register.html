<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusHub | Create Account</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Create student account</h2>
        <p>Use your own email address and password.</p>
      </div>
      <div id="register-alert" class="alert-box alert-danger"></div>
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full name</label>
          <input class="form-input" id="name" name="name" autocomplete="name" maxlength="100" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="department">Department</label>
          <select class="form-input" id="department" required>
            <option value="">Loading departments...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Create password</label>
          <input class="form-input" id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm password</label>
          <input class="form-input" id="confirm-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        </div>
        <button class="btn" id="register-btn" type="submit">Create account</button>
      </form>
      <p style="margin-top:18px; text-align:center; font-size:0.9rem;">
        <a href="login.html" style="color:#a5b4fc;">Already have an account? Sign in</a>
      </p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    const alertBox = document.getElementById('register-alert');
    const departmentSelect = document.getElementById('department');
    const registerButton = document.getElementById('register-btn');

    document.addEventListener('DOMContentLoaded', loadDepartments);

    async function loadDepartments() {
      const response = await apiFetch('/auth/departments');
      if (!response?.ok || !response.data.success) {
        departmentSelect.innerHTML = '<option value="">Departments unavailable</option>';
        showRegisterAlert(response?.data?.message || 'Unable to load departments. Make sure the CampusHub backend is running.', false);
        return;
      }

      departmentSelect.innerHTML = '<option value="">Select your department</option>';
      response.data.data.forEach(department => {
        const option = document.createElement('option');
        option.value = department._id;
        option.textContent = `${department.name} (${department.code})`;
        departmentSelect.appendChild(option);
      });
    }

    document.getElementById('register-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (document.getElementById('password').value !== document.getElementById('confirm-password').value) {
        showRegisterAlert('Passwords do not match.', false);
        return;
      }

      registerButton.disabled = true;
      registerButton.textContent = 'Creating account...';
      const response = await apiFetch('/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          departmentId: departmentSelect.value
        })
      });

      if (response?.ok && response.data.success) {
        const { challengeId, email } = response.data.data;
        window.location.href = `verify-email.html?email=${encodeURIComponent(email)}&challengeId=${encodeURIComponent(challengeId)}`;
        return;
      }

      showRegisterAlert(response?.data?.message || 'Account creation failed.', false);
      registerButton.disabled = false;
      registerButton.textContent = 'Create account';
    });

    function showRegisterAlert(message, success) {
      alertBox.textContent = message;
      alertBox.className = `alert-box ${success ? 'alert-success' : 'alert-danger'}`;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
