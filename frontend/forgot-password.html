<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusHub | Reset Password</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Reset your password</h2>
        <p>We’ll email a one-time reset code if an account exists.</p>
      </div>
      <div id="reset-alert" class="alert-box alert-danger"></div>
      <form id="request-reset-form">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" id="email" type="email" autocomplete="email" required>
        </div>
        <button class="btn" id="request-reset-btn" type="submit">Send reset code</button>
      </form>
      <form id="complete-reset-form" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="code">Six-digit email code</label>
          <input class="form-input" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="new-password">New password</label>
          <input class="form-input" id="new-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm new password</label>
          <input class="form-input" id="confirm-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        </div>
        <button class="btn" id="complete-reset-btn" type="submit">Set new password</button>
      </form>
      <p style="margin-top:18px; text-align:center;"><a href="login.html" style="color:#a5b4fc;">Back to sign in</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    const alertBox = document.getElementById('reset-alert');
    let resetChallengeId = '';

    document.getElementById('request-reset-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('request-reset-btn');
      button.disabled = true;
      const email = document.getElementById('email').value.trim();
      const response = await apiFetch('/auth/forgot-password', {
        method: 'POST',
        body: JSON.stringify({ email })
      });

      if (response?.ok && response.data.success) {
        resetChallengeId = response.data.data.challengeId;
        document.getElementById('request-reset-form').style.display = 'none';
        document.getElementById('complete-reset-form').style.display = 'block';
        showResetAlert(response.data.message, true);
      } else {
        showResetAlert(response?.data?.message || 'Could not request a password reset.', false);
        button.disabled = false;
      }
    });

    document.getElementById('complete-reset-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('new-password').value;
      if (password !== document.getElementById('confirm-password').value) {
        showResetAlert('Passwords do not match.', false);
        return;
      }

      const button = document.getElementById('complete-reset-btn');
      button.disabled = true;
      const response = await apiFetch('/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          challengeId: resetChallengeId,
          code: document.getElementById('code').value.trim(),
          password
        })
      });
      if (response?.ok && response.data.success) {
        showResetAlert(`${response.data.message} Returning to sign in...`, true);
        setTimeout(() => { window.location.href = 'login.html'; }, 1600);
      } else {
        showResetAlert(response?.data?.message || 'Password reset failed.', false);
        button.disabled = false;
      }
    });

    function showResetAlert(message, success) {
      alertBox.textContent = message;
      alertBox.className = `alert-box ${success ? 'alert-success' : 'alert-danger'}`;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
